# pytest configuration file for the pharma-data-pipeline test suite
[pytest]
# Discover tests only in the tests/ directory
testpaths = tests

# Verbose output by default — shows each test name as it runs
addopts = -v --tb=short

# Log output during tests (shows logger.info() calls)
log_cli = true
log_cli_level = WARNING

# Test file naming convention
python_files = test_*.py
python_classes = Test*
python_functions = test_*
