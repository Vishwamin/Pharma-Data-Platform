name: Pharma Data Platform CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-validate:
    name: Run Test Suite & Medallion Pipeline
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: pharma_admin
          POSTGRES_PASSWORD: pharma_pass
          POSTGRES_DB: pharma_clinical_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Full Medallion Pipeline (Phase 7 Orchestrator)
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: pharma_clinical_db
          POSTGRES_USER: pharma_admin
          POSTGRES_PASSWORD: pharma_pass
        run: |
          python src/orchestrator.py --name "ci_automated_run" --triggered-by "github_actions"

      - name: Run Pytest Test Suite
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: pharma_clinical_db
          POSTGRES_USER: pharma_admin
          POSTGRES_PASSWORD: pharma_pass
        run: |
          pytest tests/ -v --tb=short

      - name: Verify Pipeline Run History in Metadata Store
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: pharma_clinical_db
          POSTGRES_USER: pharma_admin
          POSTGRES_PASSWORD: pharma_pass
        run: |
          python src/orchestrator.py --history

      - name: Upload Pipeline Execution Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-execution-logs
          path: logs/
          retention-days: 7
